global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: bookingsvc
    static_configs:
      - targets: ["bookingsvc:8081"]

  - job_name: hotelsvc
    static_configs:
      - targets: ["hotelsvc:8080"]