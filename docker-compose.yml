services:
  hotels-db:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: hotels

    volumes:
      - hotels_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d hotels"]
      interval: 5s
      timeout: 3s
      retries: 10


  hotels-migrate:
    image: migrate/migrate:latest

    volumes:
      - ./hotelsvc/migrations:/migrations:ro

    command:
      [
        "-path=/migrations",
        "-database=postgres://booking:booking@hotels-db:5432/hotels?sslmode=disable",
        "up"
      ]

    depends_on:
      hotels-db:
        condition: service_healthy


  bookings-db:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: bookings

    volumes:
      - bookings_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d bookings"]
      interval: 5s
      timeout: 3s
      retries: 10


  bookings-migrate:
    image: migrate/migrate:latest

    volumes:
      - ./bookingsvc/migrations:/migrations:ro

    command:
      [
        "-path=/migrations",
        "-database=postgres://booking:booking@bookings-db:5432/bookings?sslmode=disable",
        "up"
      ]

    depends_on:
      bookings-db:
        condition: service_healthy


  hotelsvc:
    build:
      context: ./hotelsvc
      dockerfile: Dockerfile

    environment:
      OTEL_SERVICE_NAME: hotelsvc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      DB_DSN: "postgres://booking:booking@hotels-db:5432/hotels?sslmode=disable"

    depends_on:
      jaeger:
        condition: service_healthy

      hotels-db:
        condition: service_healthy

      hotels-migrate:
        condition: service_completed_successfully

    ports:
      - "8080:8080"
      - "50051:50051"


  bookingsvc:
    build:
      context: ./bookingsvc
      dockerfile: Dockerfile

    environment:
      OTEL_SERVICE_NAME: bookingsvc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      POSTGRES_DSN: "postgres://booking:booking@bookings-db:5432/bookings?sslmode=disable"

    depends_on:
      jaeger:
        condition: service_healthy

      bookings-db:
        condition: service_healthy

      bookings-migrate:
        condition: service_completed_successfully

      hotelsvc:
        condition: service_started

      kafka:
        condition: service_healthy

    ports:
      - "8081:8081"

  notificationsvc:
    build:
      context: ./notificationsvc
      dockerfile: Dockerfile

    env_file:
      - ./notificationsvc/.env

    environment:
      OTEL_SERVICE_NAME: notificationsvc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      jaeger:
        condition: service_healthy

      kafka:
        condition: service_healthy

    restart: on-failure

    ports:
      - "127.0.0.1:8082:8082"
    
  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: CONTROLLER://:29093,DOCKER://:29092,LOCAL://:9092

      KAFKA_ADVERTISED_LISTENERS: DOCKER://kafka:29092,LOCAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,LOCAL:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.11.0

    command:
      - "--kafka.server=kafka:29092"
      - "--kafka.version=4.1.1"

    ports:
      - "127.0.0.1:9308:9308"

    depends_on:
      kafka:
        condition: service_healthy

    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.3
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.26
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 5s
      timeout: 8s
      retries: 24

  jaeger:
    image: jaegertracing/jaeger:2.18.0
    command: ["--config=/etc/jaeger/config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/status"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./observability/jaeger/config.yaml:/etc/jaeger/config.yaml:ro
    ports:
      - "127.0.0.1:16686:16686"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  elasticsearch-data:
  hotels_data:
  bookings_data:
  kafka-data:
  prometheus-data:
  grafana-data:
